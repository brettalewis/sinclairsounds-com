<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Wave Navbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a; /* Slate 900 */
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Navbar container */
        .navbar {
            display: flex;
            background: rgba(30, 41, 59, 0.7); /* Translucent slate */
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 16px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Navigation link item */
        .nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 60px;
            cursor: pointer;
            text-decoration: none;
            color: #94a3b8; /* Muted slate text */
            transition: color 0.3s ease;
        }

        /* Interactive states */
        .nav-item:hover, 
        .nav-item.active {
            color: #38bdf8; /* Bright Sky Blue */
        }

        .nav-label {
            font-size: 11px;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Soundwave Slider Grid Container */
        .sound-wave {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            width: 100%;
        }

        /* Individual Audio Bars */
        .bar {
            width: 3px;
            height: 4px; /* Idle baseline state */
            background-color: #64748b;
            border-radius: 3px;
            transition: background-color 0.3s, height 0.3s;
        }

        /* Active / Hover Sound Simulation Trigger */
        .nav-item:hover .bar, 
        .nav-item.active .bar {
            background-color: #38bdf8;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }

        /* Staggered animation delays to simulate a realistic audio visualizer spectrum */
        .nav-item:hover .bar:nth-child(1), .nav-item.active .bar:nth-child(1) { animation-delay: 0.1s; }
        .nav-item:hover .bar:nth-child(2), .nav-item.active .bar:nth-child(2) { animation-delay: 0.35s; }
        .nav-item:hover .bar:nth-child(3), .nav-item.active .bar:nth-child(3) { animation-delay: 0.2s; }
        .nav-item:hover .bar:nth-child(4), .nav-item.active .bar:nth-child(4) { animation-delay: 0.45s; }
        .nav-item:hover .bar:nth-child(5), .nav-item.active .bar:nth-child(5) { animation-delay: 0.15s; }

        /* Equalizer Animation Definition */
        @keyframes bounce {
            0% {
                height: 4px;
            }
            100% {
                height: 20px; /* Peak audio height */
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-item active">
            <div class="sound-wave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span class="nav-label">Home</span>
        </a>
        <a href="#" class="nav-item">
            <div class="sound-wave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span class="nav-label">Discover</span>
        </a>
        <a href="#" class="nav-item">
            <div class="sound-wave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span class="nav-label">Library</span>
        </a>
        <a href="#" class="nav-item">
            <div class="sound-wave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span class="nav-label">Config</span>
        </a>
    </nav>

    <script>
        // Smoothly toggle the active class when clicking different items
        const items = document.querySelectorAll('.nav-item');
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault(); // Stop page reload for demo links
                items.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
